name = "hyprtrixie-setup"
name_pretty = "Setup"
icon = "preferences-system"
parent = "hyprtrixie"
fixed_order = true

[[entries]]
text = "Wi-Fi"
icon = "preferences-system-network"
keywords = ["wifi", "wireless", "network", "internet"]
actions = { "wifi" = "qs -p /usr/share/hyprtrixie/shell ipc call popup toggle wifi" }

[[entries]]
text = "Audio"
icon = "multimedia-volume-control"
keywords = ["audio", "sound", "volume", "speaker", "microphone"]
actions = { "audio" = "qs -p /usr/share/hyprtrixie/shell ipc call popup toggle audio" }

[[entries]]
text = "Brightness"
icon = "preferences-desktop-display"
keywords = ["brightness", "screen", "backlight", "keyboard"]
actions = { "brightness" = "qs -p /usr/share/hyprtrixie/shell ipc call popup toggle brightness" }

[[entries]]
text = "Bluetooth"
icon = "bluetooth"
keywords = ["bluetooth", "headphones", "pair"]
actions = { "bluetooth" = "blueman-manager" }

[[entries]]
text = "Power"
icon = "preferences-system-power"
keywords = ["battery", "power", "profile", "performance"]
actions = { "power" = "qs -p /usr/share/hyprtrixie/shell ipc call popup toggle battery" }
