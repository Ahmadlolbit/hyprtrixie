$font = JetBrainsMono Nerd Font
$text = rgb(cdd6f4)
$accent = rgb(89b4fa)
$check = rgb(a6e3a1)
$fail = rgb(f38ba8)
$field = rgba(1e1e2ecc)
source = ~/.local/state/omarchy/current/theme/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    inner_color = $field
    outer_color = $accent
    check_color = $check
    fail_color = $fail
    font_color = $text
    font_family = $font
    fade_on_empty = false
    rounding = 0
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = {{ TIME }}
    color = $text
    font_size = 96
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $text
    font_size = 20
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}
