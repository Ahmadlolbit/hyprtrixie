add_newline = true
command_timeout = 300
format = "$directory$git_branch$git_status$python$nodejs$rust$golang$kubernetes$cmd_duration$line_break$character"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold magenta"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"

[python]
format = "[$symbol$version]($style) "
style = "cyan"

[nodejs]
format = "[$symbol$version]($style) "
style = "green"

[rust]
format = "[$symbol$version]($style) "
style = "red"

[golang]
format = "[$symbol$version]($style) "
style = "cyan"

[kubernetes]
disabled = false
format = "[$symbol$context]($style) "
style = "blue"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "bright-black"
